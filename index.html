<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SIDRA COBE - Premium modern e-commerce home page."
    />
    <title>SIDRA COBE | Modern Shopping</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
    <body>
    <header class="site-header">
      <div class="container header-row">
        <button
          class="icon-button account-button"
          type="button"
          aria-label="Profile"
          data-account-page="pages/account.html"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z" />
          </svg>
        </button>

        <a href="index.html" class="brand" aria-label="SIDRA COBE home">
          <img class="brand-logo" src="./images/logo/logo.jpg" alt="SIDRA COBE logo" />
          <span class="brand-text">SIDRA COBE</span>
        </a>

        <div class="header-actions">
          <button
            class="icon-button wishlist-button"
            type="button"
            aria-label="Wishlist"
            data-wishlist-page="pages/wishlist.html"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
            <span class="wishlist-count">0</span>
          </button>

          <button
            class="icon-button cart-button"
            type="button"
            aria-label="Cart"
            data-cart-page="pages/cart.html"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 18a2 2 0 110 4 2 2 0 010-4zm10 0a2 2 0 110 4 2 2 0 010-4zM6.2 6h14.6l-1.9 7.6a2 2 0 01-2 1.6H9.1a2 2 0 01-2-1.6L5.2 4H2V2h4l.5 2z" />
            </svg>
            <span class="cart-count">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="home-page">
      <div class="container">
        <section class="home-controls" aria-label="Product controls">
          <div id="search-container" class="search-container">
            <div class="search-wrap" aria-label="Search products">
              <div class="search-main">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10.5 3a7.5 7.5 0 015.96 12.06l4.94 4.94 1.41-1.41-4.94-4.94A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" />
                </svg>
                <input id="home-search" type="search" placeholder="Search products" data-i18n-placeholder="search" aria-label="Search products" aria-controls="search-dropdown" aria-expanded="false" autocomplete="off" />
                <button id="clear-search-button" class="clear-search-button" type="button" aria-label="Clear search" data-i18n-aria-label="clear-search" hidden>×</button>
              </div>

              <div class="search-actions" aria-label="Search actions">
                <button id="voice-search-btn" class="search-action-btn" type="button" aria-label="Voice search">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a1 1 0 112 0 7 7 0 01-6 6.93V21h-2v-2.07A7 7 0 015 12a1 1 0 112 0 5 5 0 1010 0z" />
                  </svg>
                </button>

                <button id="camera-search-btn" class="search-action-btn" type="button" aria-label="Image search">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9.5 3l1.5 2h2l1.5-2h3.5A2.5 2.5 0 0121 5.5v11A2.5 2.5 0 0118.5 19h-13A2.5 2.5 0 013 16.5v-11A2.5 2.5 0 015.5 3h4zm2.5 7a3 3 0 110 6 3 3 0 010-6z" />
                  </svg>
                </button>
              </div>
            </div>

            <div id="search-dropdown" class="search-dropdown hidden" role="region" aria-label="Search suggestions">
              <section id="recent-search-section" class="recent-search-section" hidden>
                <div class="search-panel-heading">
                  <strong data-i18n="recent-searches">Recent searches</strong>
                  <button id="clear-recent-searches" type="button" data-i18n="clear-all">Clear all</button>
                </div>
                <div id="recent-search-list"></div>
              </section>
              <div id="search-suggestions" role="listbox" aria-label="Matching products and categories"></div>
            </div>
          </div>

          <div class="search-utility-row">
            <div id="voice-search-status" class="search-status" aria-live="polite"></div>
            <div id="image-search-status" class="search-status" aria-live="polite"></div>
          </div>

          <div id="camera-search-menu" class="camera-search-menu hidden" role="menu" aria-label="Image search options">
            <button type="button" class="camera-option" data-camera-mode="camera" role="menuitem">Take Photo</button>
            <button type="button" class="camera-option" data-camera-mode="gallery" role="menuitem">Choose from Gallery</button>
          </div>

          <input id="image-search-input" class="sr-only" type="file" accept="image/*" />

          <div id="image-preview-box" class="image-preview-box hidden" aria-live="polite">
            <img id="image-search-preview" alt="Selected product reference" />
          </div>

          <div class="toolbar-row">
            <label class="toolbar-field" for="sort-select">
              <span data-i18n="sort">Sort</span>
              <select id="sort-select">
                <option value="featured">Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </label>

            <label class="toolbar-field" for="category-select">
              <span data-i18n="category">Category</span>
              <select id="category-select">
                <option value="all">All</option>
                <option value="Clothing">Clothing</option>
                <option value="Shoes">Shoes</option>
                <option value="Bags">Bags</option>
                <option value="Accessories">Accessories</option>
              </select>
            </label>

            <label class="toolbar-field" for="filter-select">
              <span data-i18n="filter">Filter</span>
              <select id="filter-select">
                <option value="all">All</option>
                <option value="under-100">Under ₹100</option>
                <option value="over-100">₹100 &amp; above</option>
              </select>
            </label>
          </div>
        </section>

        <section class="home-product-section" aria-label="Product list">
          <div class="product-grid">
            <article class="product-card" data-product-id="urban-lite-jacket" data-category="Clothing">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-one" aria-label="Urban Lite Jacket" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Clothing</span>
                  <button class="detail-link" type="button" aria-label="View Urban Lite Jacket">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹89</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="summit-runner" data-category="Shoes">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-two" aria-label="Summit Runner" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Shoes</span>
                  <button class="detail-link" type="button" aria-label="View Summit Runner">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹120</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="harbor-tote" data-category="Bags">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-three" aria-label="Harbor Tote" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Bags</span>
                  <button class="detail-link" type="button" aria-label="View Harbor Tote">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹74</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="vela-shades" data-category="Accessories">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-four" aria-label="Vela Shades" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Accessories</span>
                  <button class="detail-link" type="button" aria-label="View Vela Shades">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹58</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="coastline-hoodie" data-category="Clothing">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-five" aria-label="Coastline Hoodie" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Clothing</span>
                  <button class="detail-link" type="button" aria-label="View Coastline Hoodie">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹96</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="northbound-bag" data-category="Bags">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-six" aria-label="Northbound Bag" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Bags</span>
                  <button class="detail-link" type="button" aria-label="View Northbound Bag">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹110</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="metro-sneaker" data-category="Shoes">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-seven" aria-label="Metro Sneaker" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Shoes</span>
                  <button class="detail-link" type="button" aria-label="View Metro Sneaker">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹132</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>

            <article class="product-card" data-product-id="city-accent-watch" data-category="Accessories">
              <button class="wishlist-btn" type="button" aria-label="Add to wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </button>
              <div class="product-media media-eight" aria-label="City Accent Watch" tabindex="0"></div>
              <div class="product-card-body">
                <div class="product-card-meta">
                  <span class="product-category">Accessories</span>
                  <button class="detail-link" type="button" aria-label="View City Accent Watch">View</button>
                </div>
                <div class="product-card-footer">
                  <div class="product-price"><span class="price">₹86</span></div>
                  <button class="button-primary" type="button">Add to Cart</button>
                </div>
              </div>
            </article>
          </div>

          <div class="home-empty-state" hidden>
            <h2 data-i18n="no-products-found">No products found</h2>
            <p>Search term: <strong id="no-results-term"></strong></p>
            <div class="empty-search-actions">
              <button id="clear-search-results" type="button" class="empty-action" data-i18n="clear-search">Clear search</button>
              <button id="browse-categories-button" type="button" class="empty-action" data-i18n="browse-categories">Browse Categories</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="mobile-nav-item is-active" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8zm0 2.2L5 9.8V18h2v-6h10v6h2V9.8l-7-6.6z" />
        </svg>
        <span data-i18n="home">Home</span>
      </a>

      <a href="pages/account.html#orders-section" class="mobile-nav-item" aria-label="My Orders">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4h10l3 4v11a2 2 0 01-2 2H6a2 2 0 01-2-2V8l3-4zm0 2l-2 3h14l-2-3H7zm-1 5h12v8H6v-8z" />
        </svg>
        <span data-i18n="my-order">My Order</span>
      </a>

      <button type="button" class="mobile-nav-item ai-button" aria-label="AI Assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a7 7 0 016.76 10.5l1.14 1.14a2 2 0 01-2.83 2.83l-1.14-1.14A7 7 0 1112 2zm0 2a5 5 0 103.54 8.54A5 5 0 0012 4zm-1 3h2v5h-2V7zm0 6h2v2h-2v-2z" />
        </svg>
        <span data-i18n="ai">AI</span>
      </button>

      <a href="pages/account.html" class="mobile-nav-item" aria-label="Account">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z" />
        </svg>
        <span data-i18n="account">Account</span>
      </a>
    </nav>

    <script src="js/main.js"></script>
  </body>
</html>
