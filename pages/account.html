<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIDRA COBE | Account</title>
    <style>
      :root {
        --primary: #111111;
        --primary-soft: #f4f1ed;
        --surface: #ffffff;
        --background: #f7f4f1;
        --line: #eae4dd;
        --text: #1a1a1a;
        --muted: #666666;
        --shadow: 0 16px 34px rgba(17, 17, 17, 0.08);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--background);
        color: var(--text);
        line-height: 1.6;
      }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      img { max-width: 100%; display: block; }

      .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 18px; }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid rgba(17, 17, 17, 0.06);
        backdrop-filter: blur(8px);
      }

      .header-row {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 12px;
        min-height: 72px;
      }

      .brand {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
        object-fit: cover;
        border-radius: 10px;
      }

      .brand-text {
        font-size: 0.8rem;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--primary-soft);
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .cart-count, .wishlist-count {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        padding: 2px 5px;
        border-radius: 999px;
        background: var(--text);
        color: #fff;
        font-size: 0.62rem;
        font-weight: 800;
      }

      .account-page {
        padding: 20px 0 92px;
      }

      .profile-shell {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 28px;
      }

      .profile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .back-home {
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
      }

      .profile-title {
        margin: 0;
        text-align: center;
        font-size: 1.2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
        flex: 1;
      }

      .profile-list {
        display: grid;
        gap: 10px;
      }

      .profile-option { min-height: 64px; }

      .orders-box {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }

      .profile-order {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        padding: 12px 14px;
        display: grid;
        gap: 6px;
      }

      .order-product-image { width: 72px; height: 84px; border-radius: 10px; object-fit: cover; }
      .order-card-product { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 12px; }
      .order-card-status { font-weight: 700; }

      .profile-order strong {
        font-size: 0.96rem;
      }

      .profile-order small {
        color: var(--muted);
      }

      .profile-order-actions { display: flex; gap: 12px; flex-wrap: wrap; }
      .profile-order-actions a,
      .address-actions button { min-height: 44px; display: inline-flex; align-items: center; color: var(--text); font-weight: 700; }
      .profile-order-actions a { min-height: 44px; display: inline-flex; align-items: center; color: var(--text); font-weight: 700; }

      .profile-option {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 10px 22px rgba(17, 17, 17, 0.02);
        padding: 16px 16px;
        color: var(--text);
        text-align: left;
      }

      .option-icon {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--primary-soft);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--text);
        flex-shrink: 0;
      }

      .option-label {
        flex: 1;
        font-size: 1rem;
        font-weight: 700;
      }

      .chevron {
        font-size: 1.4rem;
        color: var(--muted);
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(17, 17, 17, 0.46);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 50;
      }

      .modal.hidden {
        display: none;
      }

      .modal-card {
        width: min(100%, 480px);
        max-height: min(90vh, 760px);
        overflow-y: auto;
        background: var(--surface);
        border-radius: 24px 24px 0 0;
        padding: 20px 18px 22px;
        box-shadow: var(--shadow);
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .modal-head h3 {
        margin: 0;
        font-size: 1.1rem;
      }

      .close-btn {
        border: none;
        background: var(--primary-soft);
        border-radius: 10px;
        width: 34px;
        height: 34px;
        font-size: 1.1rem;
      }

      .lang-list, .star-row {
        display: grid;
        gap: 10px;
      }

      .lang-option, .star-btn {
        border: 1px solid var(--line);
        background: var(--background);
        color: var(--text);
        border-radius: 14px;
        min-height: 48px;
        padding: 0 14px;
        text-align: left;
        font-weight: 700;
      }

      .address-list { display: grid; gap: 10px; margin-bottom: 16px; }
      .address-entry { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; }
      .address-entry p { margin: 0; color: var(--muted); font-size: 0.88rem; }
      .address-actions { display: flex; gap: 14px; }
      .address-actions button { border: 0; background: none; padding: 0; }
      .address-form { display: grid; gap: 10px; }
      .address-form input,
      .address-form textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); }
      .address-form textarea { min-height: 88px; resize: vertical; }
      .address-form label { color: var(--muted); font-size: 0.82rem; font-weight: 700; }
      .form-error { min-height: 1.2em; color: #a33131; font-size: 0.82rem; }
      .primary-btn { min-height: 48px; border: 0; border-radius: 12px; padding: 0 16px; background: var(--text); color: #fff; font-weight: 700; }
      .secondary-btn { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: #fff; color: var(--text); font-weight: 700; }
      .review-text { width: 100%; min-height: 100px; margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; resize: vertical; }

      .lang-option.is-selected {
        background: var(--primary-soft);
        border-color: rgba(17, 17, 17, 0.12);
      }

      .star-row {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        margin-top: 8px;
      }

      .star-btn {
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        background: var(--background);
      }

      .star-btn.is-active {
        background: #fff7d9;
        border-color: #f6d76d;
      }

      .rating-note {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%) translateY(10px);
        background: rgba(17, 17, 17, 0.92);
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 0.78rem;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s ease;
        z-index: 60;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (min-width: 600px) {
        .container { max-width: 760px; }
        .profile-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .orders-box { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <button class="icon-button account-button" type="button" aria-label="Account" data-account-page="account.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z" />
          </svg>
        </button>

        <a href="../index.html" class="brand" aria-label="SIDRA COBE home">
          <img class="brand-logo" src="../images/logo/logo.jpg" alt="SIDRA COBE logo" />
          <span class="brand-text">SIDRA COBE</span>
        </a>

        <div class="header-actions">
          <button class="icon-button wishlist-button" type="button" aria-label="Wishlist" data-wishlist-page="wishlist.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 016.5 4c1.74 0 3.41.81 4.5 2.09A6.08 6.08 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
            <span class="wishlist-count">0</span>
          </button>

          <button class="icon-button cart-button" type="button" aria-label="Cart" data-cart-page="cart.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 18a2 2 0 110 4 2 2 0 010-4zm10 0a2 2 0 110 4 2 2 0 010-4zM6.2 6h14.6l-1.9 7.6a2 2 0 01-2 1.6H9.1a2 2 0 01-2-1.6L5.2 4H2V2h4l.5 2z" />
            </svg>
            <span class="cart-count">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="account-page">
      <div class="container profile-shell">
        <div class="profile-header">
          <a href="../index.html" class="back-home">← Home</a>
          <h1 class="profile-title">Account / Profile</h1>
        </div>

        <div class="profile-list">
          <a class="profile-option" href="#orders-section">
            <span class="option-icon" aria-hidden="true">▤</span>
            <span class="option-label" data-i18n="my-orders">My Orders</span>
            <span class="chevron" aria-hidden="true">›</span>
          </a>

          <button class="profile-option" type="button" data-action="addresses">
            <span class="option-icon" aria-hidden="true">⌂</span>
            <span class="option-label" data-i18n="saved-address">Saved Address</span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>

          <a class="profile-option" href="help.html">
            <span class="option-icon" aria-hidden="true">?</span>
            <span class="option-label" data-i18n="help-center">Help Center</span>
            <span class="chevron" aria-hidden="true">›</span>
          </a>

          <a class="profile-option" href="https://wa.me/918287442290" target="_blank" rel="noopener noreferrer">
            <span class="option-icon" aria-hidden="true">↗</span>
            <span class="option-label" data-i18n="whatsapp-support">WhatsApp Support</span>
            <span class="chevron" aria-hidden="true">›</span>
          </a>

          <button class="profile-option" type="button" data-action="language">
            <span class="option-icon" aria-hidden="true">A</span>
            <span class="option-label" data-i18n="change-language">Change Language</span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>

          <button class="profile-option" type="button" data-action="share">
            <span class="option-icon" aria-hidden="true">↗</span>
            <span class="option-label" data-i18n="share-product">Share Product</span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>

          <button class="profile-option" type="button" data-action="rating">
            <span class="option-icon" aria-hidden="true">★</span>
            <span class="option-label" data-i18n="rating">Rating</span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>

          <button class="profile-option" type="button" data-action="logout">
            <span class="option-icon" aria-hidden="true">↪</span>
            <span class="option-label" data-i18n="logout">Logout</span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </div>

        <div id="orders-section" class="orders-box">
          <div class="profile-order" id="orders-empty"><strong data-i18n="my-orders">My Orders</strong><small>No orders found.</small></div>
        </div>
      </div>
    </main>

    <div id="language-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="language-title">
        <div class="modal-head">
          <h3 id="language-title" data-i18n="change-language">Change Language</h3>
          <button type="button" class="close-btn" data-close="language" aria-label="Close">×</button>
        </div>

        <div class="lang-list">
          <button type="button" class="lang-option is-selected" data-lang="en">English</button>
          <button type="button" class="lang-option" data-lang="hi">हिन्दी</button>
          <button type="button" class="lang-option" data-lang="hinglish">Hinglish</button>
        </div>
      </div>
    </div>

    <div id="address-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="address-title">
        <div class="modal-head">
          <h3 id="address-title" data-i18n="saved-address">Saved Address</h3>
          <button type="button" class="close-btn" data-close="address" aria-label="Close">×</button>
        </div>
        <div id="address-list" class="address-list"></div>
        <form id="address-form" class="address-form">
          <strong id="address-form-title">Add address</strong>
          <label for="address-name">Full Name</label>
          <input id="address-name" type="text" autocomplete="name" placeholder="Full Name" required />
          <label for="address-mobile">Mobile Number</label>
          <input id="address-mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="Indian mobile number" required />
          <label for="address-complete">Complete Address</label>
          <textarea id="address-complete" autocomplete="street-address" placeholder="Complete Address" required></textarea>
          <label for="address-city">City</label>
          <input id="address-city" type="text" autocomplete="address-level2" placeholder="City" required />
          <label for="address-state">State</label>
          <input id="address-state" type="text" autocomplete="address-level1" placeholder="State" required />
          <label for="address-pin">PIN Code</label>
          <input id="address-pin" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="6-digit PIN Code" required />
          <div id="address-error" class="form-error" role="alert" aria-live="polite"></div>
          <button type="submit" class="primary-btn" id="save-address">Save Address</button>
          <button type="button" class="secondary-btn" id="cancel-address-edit" hidden>Cancel Edit</button>
        </form>
      </div>
    </div>

    <div id="rating-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rating-title">
        <div class="modal-head">
          <h3 id="rating-title">Rate SIDRA COBE</h3>
          <button type="button" class="close-btn" data-close="rating" aria-label="Close">×</button>
        </div>

        <div class="star-row" aria-label="Rating stars">
          <button type="button" class="star-btn" data-value="1" aria-label="1 star">★</button>
          <button type="button" class="star-btn" data-value="2" aria-label="2 stars">★</button>
          <button type="button" class="star-btn" data-value="3" aria-label="3 stars">★</button>
          <button type="button" class="star-btn" data-value="4" aria-label="4 stars">★</button>
          <button type="button" class="star-btn" data-value="5" aria-label="5 stars">★</button>
        </div>
        <div class="rating-note" id="rating-note">Select a rating</div>
        <textarea id="review-content" class="review-text" placeholder="Write a review (optional)"></textarea>
        <div style="margin-top:12px;">
          <button type="button" id="submit-rating" class="primary-btn" style="width:100%;">Submit Rating</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="../js/main.js"></script>
    <script>
      (() => {
        const toast = document.getElementById('toast');
        const languageModal = document.getElementById('language-modal');
        const ratingModal = document.getElementById('rating-modal');
        const hideModal = (modal) => {
          modal.classList.add('hidden');
          modal.setAttribute('aria-hidden', 'true');
        };
        const openModal = (modal) => {
          modal.classList.remove('hidden');
          modal.setAttribute('aria-hidden', 'false');
        };
        const showToast = (message) => {
          toast.textContent = message;
          toast.classList.add('show');
          clearTimeout(showToast.timeoutId);
          showToast.timeoutId = setTimeout(() => toast.classList.remove('show'), 1800);
        };

        const ADDRESS_KEY = 'sidraCobeAddresses';
        let editingAddressIndex = null;

        const readAddresses = () => {
          try {
            const addresses = JSON.parse(localStorage.getItem(ADDRESS_KEY) || '[]');
            return Array.isArray(addresses) ? addresses : [];
          } catch (error) {
            return [];
          }
        };

        const readOrders = () => {
          try {
            const raw = localStorage.getItem('sidraCobeOrders');
            const list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (error) {
            return [];
          }
        };

        const renderOrders = () => {
          const section = document.getElementById('orders-section');
          const orders = readOrders();
          section.innerHTML = '';
          if (!orders.length) {
            const empty = document.createElement('div');
            empty.className = 'profile-order';
            empty.innerHTML = '<strong>My Orders</strong><small>No orders found.</small>';
            section.appendChild(empty);
            return;
          }

          orders.forEach((order) => {
            const items = Array.isArray(order.items) ? order.items : [];
            const firstItem = items[0] || {};
            const imageClass = firstItem.imageClass || order.productImage || "media-one";
            const imagePath = window.getSidraImagePath ? window.getSidraImagePath(imageClass) : `../images/products/${imageClass.replace("media-", "")}.jpg`;
            const statusLabels = { ORDER_PLACED: "Order Placed", CONFIRMED: "Confirmed", PROCESSING: "Processing", SHIPPED: "Shipped", OUT_FOR_DELIVERY: "Out for Delivery", DELIVERED: "Delivered" };
            const legacyStatus = order.status === "Order Confirmed" ? "Confirmed" : order.status;
            const status = statusLabels[order.statusCode] || Object.values(statusLabels).find((label) => label === legacyStatus) || "Status unavailable";
            const article = document.createElement('article');
            article.className = 'profile-order';
            const heading = document.createElement('strong');
            heading.textContent = order.orderNumber || order.orderId || 'Order';
            const date = document.createElement('small');
            date.textContent = order.date || (order.createdAt ? new Date(order.createdAt).toLocaleDateString() : 'Date unavailable');
            const product = document.createElement('div');
            product.className = 'order-card-product';
            const image = document.createElement('img');
            image.className = 'order-product-image';
            image.src = imagePath;
            image.alt = firstItem.name || order.productName || 'Ordered product';
            const productDetails = document.createElement('div');
            const details = document.createElement('small');
            details.textContent = items.length
              ? items.map((item) => `${item.name} × ${item.quantity}`).join(', ')
              : `${order.productName || order.products || 'Order details unavailable'} · Qty ${order.quantity || 1}`;
            const total = document.createElement('strong');
            total.textContent = order.total || `₹${Number(order.totalValue || 0).toLocaleString('en-IN')}`;
            productDetails.append(details, total);
            product.append(image, productDetails);
            const statusLine = document.createElement('small');
            statusLine.className = 'order-card-status';
            statusLine.textContent = status;
            const actions = document.createElement('div');
            actions.className = 'profile-order-actions';
            const detailsLink = document.createElement('a');
            detailsLink.href = `order-details.html?order=${encodeURIComponent(order.orderNumber || order.orderId || '')}`;
            detailsLink.textContent = 'View Details';
            const trackingLink = document.createElement('a');
            trackingLink.href = `tracking.html?order=${encodeURIComponent(order.orderNumber || order.orderId || '')}`;
            trackingLink.textContent = 'Track order';
            actions.append(detailsLink, trackingLink);
            article.append(heading, date, product, statusLine, actions);
            section.appendChild(article);
          });
        };

        const renderAddresses = () => {
          const list = document.getElementById('address-list');
          const addresses = readAddresses();
          list.innerHTML = '';
          if (!addresses.length) {
            const empty = document.createElement('p');
            empty.className = 'muted';
            empty.textContent = 'No saved addresses.';
            list.appendChild(empty);
          }

          addresses.forEach((address, index) => {
            const entry = document.createElement('article');
            entry.className = 'address-entry';
            const name = document.createElement('strong');
            name.textContent = address.fullName || 'Saved address';
            const details = document.createElement('p');
            details.textContent = [address.mobile, address.house, address.street, address.city, address.state, address.pin].filter(Boolean).join(', ');
            const actions = document.createElement('div');
            actions.className = 'address-actions';
            const edit = document.createElement('button');
            edit.type = 'button';
            edit.dataset.addressAction = 'edit';
            edit.dataset.addressIndex = String(index);
            edit.textContent = 'Edit';
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.dataset.addressAction = 'remove';
            remove.dataset.addressIndex = String(index);
            remove.textContent = 'Delete';
            actions.append(edit, remove);
            entry.append(name, details, actions);
            list.appendChild(entry);
          });
        };

        const resetAddressForm = () => {
          editingAddressIndex = null;
          document.getElementById('address-form').reset();
          document.getElementById('address-form-title').textContent = 'Add address';
          document.getElementById('save-address').textContent = 'Save Address';
          document.getElementById('cancel-address-edit').hidden = true;
          document.getElementById('address-error').textContent = '';
        };

        const editAddress = (index) => {
          const address = readAddresses()[index];
          if (!address) return;
          editingAddressIndex = index;
          document.getElementById('address-name').value = address.fullName || '';
          document.getElementById('address-mobile').value = address.mobile || '';
          document.getElementById('address-complete').value = address.house || '';
          document.getElementById('address-city').value = address.city || '';
          document.getElementById('address-state').value = address.state || '';
          document.getElementById('address-pin').value = address.pin || '';
          document.getElementById('address-form-title').textContent = 'Edit address';
          document.getElementById('save-address').textContent = 'Update Address';
          document.getElementById('cancel-address-edit').hidden = false;
          document.getElementById('address-name').focus();
        };

        const saveAddress = (event) => {
          event.preventDefault();
          const mobile = document.getElementById('address-mobile').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
          const pin = document.getElementById('address-pin').value.trim();
          const addressError = document.getElementById('address-error');
          if (!/^[6-9]\d{9}$/.test(mobile)) {
            addressError.textContent = 'Enter a valid Indian mobile number.';
            return;
          }
          if (!/^[1-9]\d{5}$/.test(pin)) {
            addressError.textContent = 'Enter a valid 6-digit Indian PIN code.';
            return;
          }

          const address = {
            fullName: document.getElementById('address-name').value.trim(),
            mobile,
            house: document.getElementById('address-complete').value.trim(),
            street: '',
            city: document.getElementById('address-city').value.trim(),
            state: document.getElementById('address-state').value.trim(),
            pin
          };
          if (!address.fullName || !address.mobile || !address.house || !address.city || !address.state || !address.pin) {
            addressError.textContent = 'Complete every required address field.';
            return;
          }

          const addresses = readAddresses();
          if (editingAddressIndex === null) {
            addresses.push(address);
          } else {
            addresses[editingAddressIndex] = address;
          }
          localStorage.setItem(ADDRESS_KEY, JSON.stringify(addresses));
          resetAddressForm();
          renderAddresses();
          showToast('Address saved');
        };

        const updateLanguageSelection = () => {
          const current = window.getSidraLanguage ? window.getSidraLanguage() : (localStorage.getItem('sidraLanguage') || 'en');
          document.querySelectorAll('.lang-option').forEach((button) => {
            button.classList.toggle('is-selected', button.dataset.lang === current);
          });
        };

        document.querySelectorAll('[data-close]').forEach((button) => {
          button.addEventListener('click', () => {
            const target = button.dataset.close;
            if (target === 'language') hideModal(languageModal);
            if (target === 'address') hideModal(document.getElementById('address-modal'));
            if (target === 'rating') hideModal(ratingModal);
          });
        });

        document.querySelector('[data-action="language"]').addEventListener('click', () => openModal(languageModal));
        document.querySelector('[data-action="addresses"]').addEventListener('click', () => {
          resetAddressForm();
          renderAddresses();
          openModal(document.getElementById('address-modal'));
        });

        document.getElementById('address-form').addEventListener('submit', saveAddress);
        document.getElementById('cancel-address-edit').addEventListener('click', resetAddressForm);
        document.getElementById('address-list').addEventListener('click', (event) => {
          const button = event.target.closest('[data-address-action]');
          if (!button) return;
          const index = Number(button.dataset.addressIndex);
          if (button.dataset.addressAction === 'edit') {
            editAddress(index);
            return;
          }
          const addresses = readAddresses();
          addresses.splice(index, 1);
          localStorage.setItem(ADDRESS_KEY, JSON.stringify(addresses));
          if (editingAddressIndex !== null) resetAddressForm();
          renderAddresses();
          showToast('Address deleted');
        });

        document.querySelectorAll('.lang-option').forEach((button) => {
          button.addEventListener('click', () => {
            const nextLang = button.dataset.lang || 'en';
            if (window.setSidraLanguage) {
              window.setSidraLanguage(nextLang);
            } else {
              localStorage.setItem('sidraLanguage', nextLang);
            }
            updateLanguageSelection();
            hideModal(languageModal);
            const text = nextLang === 'hi' ? 'भाषा बदल दी गई' : nextLang === 'hinglish' ? 'Hinglish selected' : 'Language set to English';
            showToast(text);
          });
        });

        document.querySelector('[data-action="share"]').addEventListener('click', async () => {
          const storedProductId = (() => {
            try {
              return JSON.parse(localStorage.getItem('sidraCobeSelectedProduct') || 'null')?.id || '';
            } catch (error) {
              return '';
            }
          })();
          const product = (window.SIDRA_PRODUCTS || []).find((item) => String(item.id) === String(storedProductId));
          if (!product) {
            showToast('Open a product before sharing it.');
            return;
          }

          const productUrl = new URL(`product.html?id=${encodeURIComponent(product.id)}`, window.location.href).href;
          const shareText = `Check out ${product.name} from SIDRA COBE.`;
          const shareData = {
            title: product.name,
            text: shareText,
            url: productUrl
          };

          try {
            if (navigator.share) {
              await navigator.share(shareData);
              showToast('Product shared');
              return;
            }
          } catch (error) {
            if (error.name === 'AbortError') {
              showToast('Sharing cancelled');
              return;
            }
          }

          let copied = false;
          try {
            if (navigator.clipboard) {
              await navigator.clipboard.writeText(productUrl);
              copied = true;
            }
          } catch (error) {}
          if (!copied) {
            const copyField = document.createElement('textarea');
            copyField.value = productUrl;
            copyField.style.position = 'fixed';
            copyField.style.opacity = '0';
            document.body.appendChild(copyField);
            copyField.select();
            copied = document.execCommand('copy');
            copyField.remove();
          }
          if (copied) showToast('Product link copied');
          else window.prompt('Copy the product link', productUrl);
        });

        let selectedRating = 0;
        const starButtons = Array.from(document.querySelectorAll('.star-btn'));
        const ratingNote = document.getElementById('rating-note');

        starButtons.forEach((button) => {
          button.addEventListener('click', () => {
            selectedRating = Number(button.dataset.value || 0);
            starButtons.forEach((star) => {
              star.classList.toggle('is-active', Number(star.dataset.value) <= selectedRating);
            });
            ratingNote.textContent = selectedRating === 1 ? '1 star selected' : `${selectedRating} stars selected`;
          });
        });

        document.getElementById('submit-rating').addEventListener('click', async () => {
          if (!selectedRating) {
            ratingNote.textContent = 'Select a rating';
            return;
          }

          if (typeof window.sidraSubmitReview !== 'function') {
            ratingNote.textContent = 'Review submission is not configured. Nothing was saved.';
            return;
          }

          try {
            const result = await window.sidraSubmitReview({
              rating: selectedRating,
              review: document.getElementById('review-content').value.trim()
            });
            if (!result || !result.ok) {
              ratingNote.textContent = 'Review submission could not be confirmed. Nothing was saved.';
              return;
            }
            showToast('Review submitted');
            hideModal(ratingModal);
            selectedRating = 0;
            document.getElementById('review-content').value = '';
            starButtons.forEach((star) => star.classList.remove('is-active'));
            ratingNote.textContent = 'Select a rating';
          } catch (error) {
            ratingNote.textContent = 'Review submission could not be confirmed. Nothing was saved.';
          }
        });

        document.querySelector('[data-action="rating"]').addEventListener('click', () => openModal(ratingModal));
        document.querySelector('[data-action="logout"]').addEventListener('click', () => {
          localStorage.removeItem('sidraCobeAuth');
          localStorage.removeItem('sidraCobeDemoSession');
          window.location.href = 'login.html';
        });

        document.querySelectorAll('.account-button').forEach((button) => {
          button.addEventListener('click', () => { window.location.href = 'account.html'; });
        });
        document.querySelectorAll('.wishlist-button').forEach((button) => {
          button.addEventListener('click', () => { window.location.href = 'wishlist.html'; });
        });
        document.querySelectorAll('.cart-button').forEach((button) => {
          button.addEventListener('click', () => { window.location.href = 'cart.html'; });
        });

        document.querySelectorAll('.modal').forEach((modal) => {
          modal.addEventListener('click', (event) => {
            if (event.target === modal) hideModal(modal);
          });
        });

        if (window.applySidraTranslation) {
          window.applySidraTranslation();
        }
        updateLanguageSelection();
        renderOrders();
        renderAddresses();
      })();
    </script>
  </body>
</html>
