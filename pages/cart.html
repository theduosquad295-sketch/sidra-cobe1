<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIDRA COBE | Cart</title>
    <style>
      :root {
        --bg: #f7f3ee;
        --surface: #ffffff;
        --line: #eae1d7;
        --text: #1a1a1a;
        --muted: #666666;
        --primary: #111111;
        --primary-soft: #f4f1ed;
        --shadow: 0 18px 38px rgba(17, 17, 17, 0.08);
        --success: #1d7a43;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      img { max-width: 100%; display: block; }

      .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 18px; }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255,255,255,0.96);
        border-bottom: 1px solid rgba(17,17,17,0.06);
        backdrop-filter: blur(10px);
      }

      .header-row {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        gap: 10px;
        min-height: 72px;
      }

      .back-link {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--text);
        font-size: 1.3rem;
        font-weight: 700;
      }

      .header-title {
        justify-self: center;
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .header-icon {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--primary-soft);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .header-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .cart-count {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        padding: 2px 4px;
        border-radius: 999px;
        background: var(--text);
        color: #fff;
        font-size: 0.62rem;
        font-weight: 800;
      }

      .page {
        padding: 18px 0 110px;
      }

      .empty-state {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 32px 20px;
        text-align: center;
      }

      .empty-state.hidden {
        display: none;
      }

      .empty-state h2 {
        margin: 0 0 10px;
        font-size: 1.8rem;
        letter-spacing: -0.04em;
      }

      .empty-state p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      .feedback {
        min-height: 20px;
        margin: 0 0 12px;
        font-size: 0.84rem;
        color: var(--success);
        font-weight: 700;
      }

      .primary-button,
      .checkout-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border: none;
        border-radius: 14px;
        background: var(--text);
        color: #fff;
        font-weight: 800;
        text-align: center;
      }

      .cart-list {
        display: grid;
        gap: 14px;
      }

      .cart-item {
        display: grid;
        grid-template-columns: 94px 1fr;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 12px;
        box-shadow: var(--shadow);
      }

      .item-image {
        width: 100%;
        height: 116px;
        border-radius: 16px;
        object-fit: cover;
      }

      .item-body {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .item-name {
        margin: 0;
        font-size: 1rem;
        line-height: 1.3;
      }

      .item-price {
        font-size: 1.05rem;
        font-weight: 800;
        margin: 6px 0 8px;
      }

      .qty-row {
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
      }

      .quantity-control {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
        background: var(--primary-soft);
      }

      .qty-button {
        width: 44px;
        height: 44px;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 1.2rem;
        font-weight: 700;
      }

      .qty-value {
        min-width: 28px;
        text-align: center;
        font-weight: 800;
      }

      .item-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .remove-link,
      .move-link {
        border: none;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        min-height: 40px;
        padding: 0 4px;
      }

      .item-options {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .summary-box {
        margin-top: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px 16px 16px;
        box-shadow: var(--shadow);
      }

      .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        color: var(--muted);
      }

      .summary-row strong {
        color: var(--text);
      }

      .summary-divider {
        height: 1px;
        background: var(--line);
        margin: 10px 0 12px;
      }

      .total-row strong {
        font-size: 1.15rem;
      }

      .coupon-box {
        margin: 14px 0 16px;
      }

      .coupon-box label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .coupon-row {
        display: flex;
        gap: 8px;
      }

      .coupon-row input {
        flex: 1;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfaf8;
        color: var(--text);
      }

      .coupon-row button {
        min-width: 86px;
        min-height: 42px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--primary-soft);
        color: var(--text);
        font-weight: 700;
      }

      #coupon-status {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .checkout-button {
        width: 100%;
        margin-top: 10px;
      }

      .checkout-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: rgba(255,255,255,0.96);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }

      .checkout-bar-inner {
        max-width: 480px;
        margin: 0 auto;
        padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .checkout-total {
        flex: 1;
      }

      .checkout-total small {
        display: block;
        color: var(--muted);
        font-size: 0.64rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .checkout-total strong {
        display: block;
        font-size: 1.1rem;
      }

      .checkout-bar .checkout-button {
        width: auto;
        min-width: 160px;
      }

      @media (min-width: 700px) {
        .container { max-width: 960px; }
        .cart-item {
          grid-template-columns: 130px 1fr;
        }
        .page { padding-top: 28px; }
        .qty-row {
          align-items: center;
          flex-direction: row;
          justify-content: space-between;
        }
        .page > .container {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
          align-items: start;
          gap: 18px;
        }
        #cart-feedback,
        #cart-empty { grid-column: 1 / -1; }
        .summary-box { position: sticky; top: 92px; margin-top: 0; }
        .checkout-bar { display: none; }
      }
    </style>
    <link rel="stylesheet" href="../css/premium-theme.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="back-link" href="../index.html" aria-label="Back to home">←</a>
        <h1 class="header-title">Cart</h1>
        <button class="header-icon" type="button" aria-label="Cart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 18a2 2 0 110 4 2 2 0 010-4zm10 0a2 2 0 110 4 2 2 0 010-4zM6.2 6h14.6l-1.9 7.6a2 2 0 01-2 1.6H9.1a2 2 0 01-2-1.6L5.2 4H2V2h4l.5 2z" />
          </svg>
          <span class="cart-count">0</span>
        </button>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <div id="cart-feedback" class="feedback" aria-live="polite"></div>

        <div id="cart-empty" class="empty-state hidden">
          <h2>Your cart is empty</h2>
          <p>Start shopping for pieces you love.</p>
          <a href="../index.html" class="primary-button">Continue Shopping</a>
        </div>

        <div id="cart-items" class="cart-list"></div>

        <aside id="cart-summary" class="summary-box">
          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotal-value">₹0</strong>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <strong id="delivery-value">₹0</strong>
          </div>
          <div class="summary-row">
            <span>Discount</span>
            <strong id="discount-value">-₹0</strong>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-row total-row">
            <span>Total</span>
            <strong id="total-value">₹0</strong>
          </div>

          <div class="coupon-box">
            <label for="coupon-input">Coupon</label>
            <div class="coupon-row">
              <input id="coupon-input" type="text" placeholder="Enter coupon code" />
              <button id="apply-coupon" type="button">Apply</button>
            </div>
            <div id="coupon-status">No active promo code.</div>
          </div>

          <button id="checkout-button" class="checkout-button" type="button">Proceed to Checkout</button>
        </aside>
      </div>
    </main>

    <div class="checkout-bar">
      <div class="checkout-bar-inner">
        <div class="checkout-total">
          <small>Total</small>
          <strong id="sticky-subtotal">₹0</strong>
        </div>
        <button id="checkout-bar-button" class="checkout-button" type="button">Checkout</button>
      </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
      (function () {
        const STORAGE_KEYS = ["sidraCobeCart", "sidraCart", "sidra-cobe-cart", "cartData"];
        const WISHLIST_KEY = "sidraCobeWishlist";
        const currency = new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0
        });

        const IMAGE_MAP = {
          "media-one": "../images/products/shirt1.jpg",
          "media-two": "../images/products/shoes1.jpg",
          "media-three": "../images/products/ladies-purse1.jpg",
          "media-four": "../images/products/sunglasses1.jpg",
          "media-five": "../images/products/hoodie1.jpg",
          "media-six": "../images/products/bag1.jpg",
          "media-seven": "../images/products/tshirt1.jpg",
          "media-eight": "../images/products/watch1.jpg"
        };

        function safeNumber(value) {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : 0;
        }

        function normalizeCart(rawCart) {
          if (!Array.isArray(rawCart)) return [];
          return rawCart
            .filter((item) => item && item.id && safeNumber(item.quantity) > 0)
            .map((item) => ({
              id: String(item.id),
              name: item.name || "Product",
              category: item.category || "Featured",
              price: safeNumber(item.price),
              quantity: safeNumber(item.quantity),
              imageClass: item.imageClass || "media-one",
              size: item.size || "",
              variant: item.variant || ""
            }));
        }

        function saveCart(cart) {
          const payload = JSON.stringify(normalizeCart(cart));
          STORAGE_KEYS.forEach((key) => {
            try { localStorage.setItem(key, payload); } catch (error) { }
          });
        }

        function readCart() {
          for (const key of STORAGE_KEYS) {
            try {
              const raw = localStorage.getItem(key);
              if (!raw) continue;
              const parsed = JSON.parse(raw);
              const normalized = normalizeCart(parsed);
              if (normalized.length || raw === "[]") {
                return normalized;
              }
            } catch (error) {
            }
          }
          return [];
        }

        function readWishlist() {
          try {
            const raw = localStorage.getItem(WISHLIST_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch (error) {
            return [];
          }
        }

        function saveWishlist(items) {
          const unique = [];
          const seen = new Set();
          items.forEach((item) => {
            const key = String(item.id);
            if (!key || seen.has(key)) return;
            seen.add(key);
            unique.push({
              id: key,
              name: item.name || "Product",
              category: item.category || "Featured",
              price: safeNumber(item.price),
              imageClass: item.imageClass || "media-one",
              size: item.size || "",
              variant: item.variant || ""
            });
          });
          localStorage.setItem(WISHLIST_KEY, JSON.stringify(unique));
        }

        function updateCartBadge() {
          const cart = readCart();
          const totalItems = cart.reduce((sum, item) => sum + safeNumber(item.quantity), 0);
          document.querySelectorAll(".cart-count").forEach((count) => {
            count.textContent = String(totalItems);
          });
        }

        function updateWishlistBadge() {
          const wishlist = readWishlist();
          document.querySelectorAll(".wishlist-count").forEach((count) => {
            count.textContent = String(wishlist.length);
          });
        }

        function formatPrice(value) {
          return currency.format(safeNumber(value));
        }

        function getProductMeta(productId) {
          if (window.getSidraProductById) {
            const found = window.getSidraProductById(productId);
            if (found) return found;
          }
          if (window.SIDRA_PRODUCTS) {
            const found = window.SIDRA_PRODUCTS.find((item) => String(item.id) === String(productId));
            if (found) return found;
          }
          return null;
        }

        function getImagePath(item) {
          const productMeta = getProductMeta(item.id);
          const imageClass = productMeta && productMeta.imageClass ? productMeta.imageClass : (item.imageClass || "media-one");
          if (window.getSidraImagePath) {
            const relative = window.getSidraImagePath(imageClass);
            if (relative) return relative;
          }
          return IMAGE_MAP[imageClass] || IMAGE_MAP["media-one"];
        }

        function setFeedback(message) {
          const feedback = document.getElementById("cart-feedback");
          if (!feedback) return;
          feedback.textContent = message;
        }

        function calculateTotals(cart) {
          const subtotal = cart.reduce((sum, item) => sum + safeNumber(item.price) * safeNumber(item.quantity), 0);
          const delivery = 0;
          const discount = 0;
          const total = Math.max(subtotal + delivery - discount, 0);
          return { subtotal, delivery, discount, total };
        }

        function updateSummary() {
          const cart = readCart();
          const totals = calculateTotals(cart);
          document.getElementById("subtotal-value").textContent = formatPrice(totals.subtotal);
          document.getElementById("delivery-value").textContent = formatPrice(totals.delivery);
          document.getElementById("discount-value").textContent = `-${formatPrice(totals.discount)}`;
          document.getElementById("total-value").textContent = formatPrice(totals.total);
          document.getElementById("sticky-subtotal").textContent = formatPrice(totals.total);
          document.getElementById("checkout-button").disabled = !cart.length;
          document.getElementById("checkout-bar-button").disabled = !cart.length;
          document.getElementById("checkout-button").style.opacity = cart.length ? "1" : "0.6";
          document.getElementById("checkout-bar-button").style.opacity = cart.length ? "1" : "0.6";
        }

        function renderCart() {
          const cart = readCart();
          const emptyState = document.getElementById("cart-empty");
          const cartItems = document.getElementById("cart-items");
          const summary = document.getElementById("cart-summary");

          updateCartBadge();
          updateWishlistBadge();
          updateSummary();

          if (!cart.length) {
            emptyState.classList.remove("hidden");
            cartItems.innerHTML = "";
            summary.style.display = "none";
            return;
          }

          emptyState.classList.add("hidden");
          summary.style.display = "block";

          cartItems.innerHTML = cart.map((item) => {
            const imagePath = getImagePath(item);
            const productMeta = getProductMeta(item.id);
            const maxQty = productMeta && Number.isFinite(Number(productMeta.stock)) ? Math.max(1, safeNumber(productMeta.stock)) : 999;
            return `
              <article class="cart-item" data-id="${item.id}">
                <img class="item-image" src="${imagePath}" alt="${item.name}" loading="lazy" />
                <div class="item-body">
                  <h2 class="item-name">${item.name}</h2>
                  <div class="item-price">${formatPrice(item.price)}</div>
                  ${item.size || item.variant ? `<p class="item-options">${[item.size && `Size: ${item.size}`, item.variant && `Variant: ${item.variant}`].filter(Boolean).join(" · ")}</p>` : ""}
                  <div class="qty-row">
                    <div class="quantity-control" aria-label="Quantity selector">
                      <button type="button" class="qty-button" data-action="decrease" data-line-index="${cart.indexOf(item)}" aria-label="Decrease quantity" ${item.quantity <= 1 ? "disabled" : ""}>−</button>
                      <span class="qty-value">${item.quantity}</span>
                      <button type="button" class="qty-button" data-action="increase" data-line-index="${cart.indexOf(item)}" aria-label="Increase quantity" ${item.quantity >= maxQty ? "disabled" : ""}>+</button>
                    </div>
                    <div class="item-actions">
                      <button type="button" class="move-link" data-action="move-to-wishlist" data-line-index="${cart.indexOf(item)}">Move to Wishlist</button>
                      <button type="button" class="remove-link" data-action="remove" data-line-index="${cart.indexOf(item)}">Remove</button>
                    </div>
                  </div>
                </div>
              </article>
            `;
          }).join("");
        }

        function adjustQuantity(lineIndex, delta) {
          const cart = readCart();
          const target = cart[Number(lineIndex)];
          if (!target) return;

          const productMeta = getProductMeta(target.id);
          const stockKnown = productMeta && Number.isFinite(Number(productMeta.stock));
          const stock = stockKnown ? Math.max(0, safeNumber(productMeta.stock)) : Number.POSITIVE_INFINITY;
          const nextQuantity = safeNumber(target.quantity) + delta;
          const minQty = 1;
          const maxQty = stockKnown ? Math.max(1, stock) : Number.POSITIVE_INFINITY;

          if (nextQuantity < minQty) {
            return;
          }

          if (nextQuantity > maxQty) {
            return;
          }

          target.quantity = nextQuantity;
          saveCart(cart);
          renderCart();
        }

        function removeItem(lineIndex) {
          const nextCart = readCart();
          nextCart.splice(Number(lineIndex), 1);
          saveCart(nextCart);
          renderCart();
          setFeedback("Item removed from cart.");
        }

        function moveToWishlist(lineIndex) {
          const cart = readCart();
          const item = cart[Number(lineIndex)];
          if (!item) return;

          const wishlist = readWishlist();
          const existingWishlistItem = wishlist.find((entry) => String(entry.id) === String(item.id));
          if (existingWishlistItem) {
            existingWishlistItem.size = item.size || existingWishlistItem.size || "";
            existingWishlistItem.variant = item.variant || existingWishlistItem.variant || "";
          } else {
            wishlist.push({
              id: String(item.id),
              name: item.name,
              category: item.category || "Featured",
              price: safeNumber(item.price),
              imageClass: item.imageClass || "media-one",
              size: item.size || "",
              variant: item.variant || ""
            });
          }
          saveWishlist(wishlist);
          cart.splice(Number(lineIndex), 1);
          saveCart(cart);
          renderCart();
          setFeedback("Moved to wishlist.");
        }

        document.addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-action]");
          if (!trigger) return;

          const action = trigger.dataset.action;
          const lineIndex = trigger.dataset.lineIndex;

          if (action === "increase") {
            adjustQuantity(lineIndex, 1);
          } else if (action === "decrease") {
            adjustQuantity(lineIndex, -1);
          } else if (action === "remove") {
            removeItem(lineIndex);
          } else if (action === "move-to-wishlist") {
            moveToWishlist(lineIndex);
          }
        });

        document.getElementById("apply-coupon").addEventListener("click", () => {
          const input = document.getElementById("coupon-input");
          const status = document.getElementById("coupon-status");
          const value = (input.value || "").trim();
          if (!value) {
            status.textContent = "Enter a coupon code to apply.";
            return;
          }
          status.textContent = "Coupon system is not connected yet. No discount has been applied.";
        });

        function proceedToCheckout() {
          if (!readCart().length) {
            return;
          }
          localStorage.removeItem("sidraCobeBuyNow");
          window.location.href = "checkout.html";
        }

        document.getElementById("checkout-button").addEventListener("click", proceedToCheckout);
        document.getElementById("checkout-bar-button").addEventListener("click", proceedToCheckout);

        renderCart();
      })();
    </script>
  </body>
</html>
