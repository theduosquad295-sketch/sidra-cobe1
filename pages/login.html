<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIDRA COBE | Login</title>
    <style>
      :root {
        --primary: #0d6efd;
        --primary-dark: #0a4fcf;
        --primary-soft: #edf5ff;
        --background: #f5f9ff;
        --surface: #ffffff;
        --line: #e7edf5;
        --text: #1d2a36;
        --muted: #64758a;
        --shadow: 0 18px 40px rgba(13, 65, 136, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #edf5ff 0%, #f7fbff 100%);
        color: var(--text);
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px 20px;
      }
      .card {
        width: min(100%, 440px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 32px 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      p { margin: 0 0 22px; color: var(--muted); }
      .field { display: grid; gap: 8px; margin-bottom: 16px; }
      label { font-weight: 700; color: var(--text); }
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 14px;
        background: #fff;
      }
      .button {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: none;
        background: var(--primary);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .button:hover { background: var(--primary-dark); }
      .meta {
        margin-top: 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .meta a { color: var(--primary); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Welcome back</h1>
        <p>Demo login for SIDRA COBE</p>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" value="customer@sidra.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" value="demo123" />
        </div>

        <button class="button" id="login-button" type="button">Login</button>

        <div class="meta">
          <a href="../index.html">Continue shopping</a>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("login-button").addEventListener("click", () => {
        localStorage.setItem("sidraCobeAuth", "logged-in");
        localStorage.setItem("sidraCobeDemoSession", "logged-in");
        window.location.href = "account.html";
      });
    </script>
  </body>
</html>
